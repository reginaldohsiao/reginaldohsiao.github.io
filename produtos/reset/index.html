<!DOCTYPE html>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Inter,system-ui,sans-serif;background:#000;color:#fff;-webkit-font-smoothing:antialiased}
.wrap{max-width:820px;margin:0 auto;padding:24px 20px 60px}
.back{color:#666;text-decoration:none;font-size:14px;display:inline-flex;align-items:center;gap:6px;margin-bottom:24px;transition:.2s}
.back:hover{color:#C9A961}

.subtitle{color:#999;font-size:18px;text-align:center;margin-bottom:32px}
.price-box{background:linear-gradient(180deg,#050505 0%,#000 100%);border:1px solid #1a1a1a;border-radius:20px;padding:28px;text-align:center;margin-bottom:32px}
.price{font-size:42px;font-weight:800;color:#F2C94C;margin-bottom:8px}

.btn-buy{display:block;width:100%;padding:18px;border-radius:14px;background:#F2C94C;color:#000;text-decoration:none;font-weight:800;font-size:16px;cursor:pointer;transition:all .2s;border:none}
.btn-buy:hover{background:#FFD760;transform:scale(1.02)}
.garantia{font-size:12px;color:#666;margin-top:12px}
.section{border:1px solid #1a1a1a;border-radius:16px;padding:24px;margin-bottom:16px;background:#050505}
.section h2{font-size:12px;color:#C9A961;letter-spacing:2px;text-transform:uppercase;font-weight:600;margin-bottom:16px}
.section h3{font-size:22px;font-weight:700;margin-bottom:12px}
.section p{color:#BDBDBD;line-height:1.6;margin-bottom:12px}
.list-item{display:flex;align-items:flex-start;gap:12px;margin:12px 0;color:#BDBDBD}
.list-item:before{content:"→";color:#F2C94C;font-weight:700;flex-shrink:0}
.modulo{background:#0A0A0A;border:1px solid #1a1a1a;border-radius:12px;padding:16px;margin:12px 0}
.modulo strong{display:block;color:#fff;margin-bottom:4px}
.modulo span{color:#888;font-size:14px}
.cta-final{background:linear-gradient(180deg,#050505 0%,#000 100%);border:1px solid #F2C94C;border-radius:20px;padding:32px 24px;text-align:center;margin-top:32px}
.cta-final h3{font-size:24px;margin-bottom:20px}
@media(max-width:600px){h1{font-size:30px}.logo{width:110px;height:110px}.logo img{padding:10px}.price{font-size:36px}.section{padding:20px}.wrap{padding:20px 16px 50px}}
</style>

<script>
function track(eventName){window.dataLayer=window.dataLayer||[];dataLayer.push({event:eventName})}
function checkout(){track('click_checkout_reset');window.location.href='https://pay.kiwify.com.br/xU0P0I6'}
</script>
</head>
