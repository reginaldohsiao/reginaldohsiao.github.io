<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Reginaldo Hsiao</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Favicon e logo para Google -->
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta property="og:image" content="https://reginaldohsiao.com.br/logo.png">

<link rel="canonical" href="https://reginaldohsiao.com.br/">
<meta name="robots" content="index, follow">
<meta http-equiv="refresh" content="0; url=https://reginaldohsiao.com.br/processo/">
<script>
  (function() {
    var params = new URLSearchParams(window.location.search);
    var comprado = params.get('comprado');
    var produtosValidos = ['mapa', 'reset', 'triade', 'sessoes'];
    
    // Se tem parâmetro ?comprado= válido, vai pro /hub/
    if (comprado && produtosValidos.includes(comprado)) {
      window.location.replace('/hub/?comprado=' + comprado);
    } else {
      // Senão, vai direto pro /processo/
      window.location.replace('https://reginaldohsiao.com.br/processo/');
    }
  })();
</script>
</head>
<body>
</body>
</html>
