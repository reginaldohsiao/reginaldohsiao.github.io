<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Reginaldo Hsiao</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<script>
  (function() {
    var params = new URLSearchParams(window.location.search);
    var comprado = params.get('comprado');
    var produtosValidos = ['mapa', 'reset', 'triade', 'sessoes'];
    
    // Delay de 300ms pra não piscar feio
    setTimeout(function() {
      if (comprado && produtosValidos.includes(comprado)) {
        window.location.replace('/hub/?comprado=' + comprado);
      } else {
        window.location.replace('/produtos/');
      }
    }, 300);
  })();
</script>
<style>
  body {
    font-family: 'Inter', sans-serif;
    background: #0b0b0b;
    color: #888;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
  }
  .logo {
    width: 80px;
    height: 80px;
    border-radius: 50%;
    margin-bottom: 20px;
    animation: pulse 1.5s infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 0.6; }
    50% { opacity: 1; }
  }
</style>
</head>
<body>
  <img src="/logo.png" class="logo" alt="RH">
  Redirecionando...
</body>
</html>
