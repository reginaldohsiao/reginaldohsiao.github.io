<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Inter', sans-serif;
  background: #0b0b0b;
  color: #fff;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
}
.container {
  max-width: 460px;
  width: 100%;
  padding: 60px 28px;
  text-align: center;
  display: flex;
  flex-direction: column;
  align-items: center;
}
.logo-wrap {
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 32px;
}
.logo {
  width: 130px;
  height: 130px;
  border-radius: 50%;
  object-fit: cover;
  object-position: center center;
  display: block;
}
h1 {
  font-size: 24px;
  font-weight: 600;
  margin-bottom: 10px;
  color: #fff;
  letter-spacing: -0.3px;
  text-align: center;
}
p {
  color: #888;
  font-size: 14px;
  margin-bottom: 40px;
  font-weight: 300;
  text-align: center;
}
.btn {
  display: block;
  width: 100%;
  padding: 16px 20px;
  margin-bottom: 12px;
  border-radius: 10px;
  text-decoration: none;
  font-weight: 500;
  font-size: 15px;
  color: #0b0b0b;
  background: #f5c542;
  transition: background 0.2s ease, transform 0.1s ease;
  text-align: center;
}
.btn:hover {
  background: #ffd95a;
  transform: translateY(-1px);
}
.btn:active {
  transform: translateY(0);
}
.footer {
  margin-top: 44px;
  font-size: 12px;
  color: #555;
  font-weight: 300;
  letter-spacing: 0.3px;
  text-align: center;
}
</style>
