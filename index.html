body {

  color: #fff;

}

  font-size: 14px; 

  margin-bottom: 40px; 

  font-weight: 300; 

} 

.btn { 

  display: block; 

  padding: 16px 20px; 

  margin-bottom: 12px; 

  border-radius: 10px; 

  text-decoration: none; 

  font-weight: 500; 

  font-size: 15px; 

  color: #0b0b0b; 

  background: #f5c542; 

  transition: background 0.2s ease, transform 0.1s ease; 

} 

.btn:hover { 

  background: #ffd95a; 

  transform: translateY(-1px); 

} 

.btn:active { 

  transform: translateY(0); 

} 

.footer { 

  margin-top: 44px; 

  font-size: 12px; 

  color: #555; 

  font-weight: 300; 

  letter-spacing: 0.3px; 

}
